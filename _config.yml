title: "嘉晃 · James"
description: "多元接納的心理空間 × 幼兒特教 × SEL 教育資源"
author: "李嘉晃 James"
email: "gahanglee@gmail.com"
github_username: gahanglee
location: "臺南市"
baseurl: ""
url: "https://gahanglee.github.io"

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

sass:
  sass_dir: assets/css
  style: compressed

# 情緒島 App 網頁版（由 emotion-island 專案 npm run build:site 產生）的程式放在 _expo，
# Jekyll 預設略過底線開頭的資料夾，要明確列入
include:
  - _expo

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - .tools

# 個人工具頁不列入 sitemap.xml
defaults:
  - scope:
      path: "busan-m2jtp1eyzs.html"
    values:
      sitemap: false
  - scope:
      path: "exam-jm7k2q.html"
    values:
      sitemap: false
  - scope:
      path: "panel-jm7k2q.html"
    values:
      sitemap: false
  - scope:
      path: "quiz-jm7k2q.html"
    values:
      sitemap: false
  - scope:
      path: "emotion-island"
    values:
      sitemap: false
