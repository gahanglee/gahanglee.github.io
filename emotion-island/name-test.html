<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>樂樂 念法試聽</title>
<style>body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;padding:16px;background:#eaf7fc;color:#0b3a4a}main{max-width:560px;margin:0 auto}
button{font:inherit;display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid #cfe5ec;border-radius:12px;background:#fff;color:#0b3a4a}
button b{font-size:20px}button small{display:block;color:#5b7f8b}#log{white-space:pre-wrap;font:12px/1.5 monospace;background:#0b3a4a;color:#d8f2fb;border-radius:10px;padding:10px;margin-top:12px}</style></head>
<body><main><h1>🎧 「樂樂」念法試聽</h1>
<p>每個按鈕念同一句「___，你好！我們一起玩吧。」，找出念成 ㄌㄜˋ ㄌㄜˋ 的寫法，再告訴我是哪一個。</p>
<div id="b"></div><div id="log"></div></main>
<script>
var TTS='https://emotion-island-nu.vercel.app/api/tts',ctx=null,src=null;
var C=[['勒勒','目前使用（勒索的勒）'],['泐泐','ㄌㄜˋ 的罕見字'],['嘞嘞','語助詞'],['仂仂','ㄌㄜˋ 的罕見字'],['快樂的樂樂','前面加「快」讓機器讀 ㄌㄜˋ'],['樂樂','原字（音樂的樂，通常念錯）']];
var log=function(m){document.getElementById('log').textContent+=m+'\n'};
C.forEach(function(c){var b=document.createElement('button');b.innerHTML='<b>'+c[0]+'</b><small>'+c[1]+'</small>';
b.onclick=function(){var AC=window.AudioContext||window.webkitAudioContext;ctx=ctx||new AC();var rp=ctx.resume();
try{var s0=ctx.createBufferSource();s0.buffer=ctx.createBuffer(1,1,22050);s0.connect(ctx.destination);s0.start(0)}catch(e){}
if(src){try{src.stop()}catch(e){}}
fetch(TTS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:c[0]+'，你好！我們一起玩吧。',voice:'soft'})})
.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()})
.then(function(ab){return rp.then(function(){return new Promise(function(a,b){ctx.decodeAudioData(ab,a,b)})})})
.then(function(buf){src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start(0);log('播放 '+c[0])})
.catch(function(e){log('失敗：'+e.message)})};
document.getElementById('b').appendChild(b)});
</script></body></html>
