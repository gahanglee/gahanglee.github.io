<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教檢刷題|特教身障組</title>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--card:#fff;--ink:#1f2937;--sub:#6b7280;--acc:#2563eb;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);padding:16px;max-width:760px;margin:0 auto}
h1{font-size:18px;margin-bottom:4px}
.sub{color:var(--sub);font-size:12px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px;color:var(--sub)}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:bold}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.qmeta{font-size:12px;color:var(--sub);margin-bottom:8px}
.qtext{font-size:15px;line-height:1.8;margin-bottom:14px;white-space:pre-wrap}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:60px;padding:12px 0;text-align:center;font-size:16px;font-weight:bold;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.right{background:#dcfce7;border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:#fee2e2;border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.ansbox{margin-top:12px;padding:12px;border-radius:8px;font-size:14px;line-height:1.7;display:none}
.ansbox.show{display:block}
.ansbox.ok{background:#dcfce7;color:#166534}
.ansbox.bad{background:#fee2e2;color:#991b1b}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.score{font-weight:bold;color:var(--ink)}
button.act{padding:10px 18px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:14px;cursor:pointer}
button.ghost{background:var(--card);color:var(--acc);border:1px solid var(--acc)}
.rev{margin-top:14px;padding:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:13px;line-height:1.7;display:none}
.rev.show{display:block}
.rev b{color:#92400e}
.cardq{font-size:15px;line-height:1.8;margin-bottom:14px}
.carda{font-size:14px;line-height:1.7;padding:12px;background:#eff6ff;border-radius:8px;color:#1e40af;display:none;margin-bottom:12px}
.carda.show{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hide{display:none!important}
.done{text-align:center;padding:30px 10px}
.done h2{font-size:22px;margin-bottom:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#eef2ff;color:#4338ca;margin-right:6px}
</style>
</head>
<body>
<h1>📝 教檢刷題|特教身障組</h1>
<div class="sub">官方試題(tqa.rcpet.edu.tw)111–113 年.答案為官方版.進度存在本機</div>
<div class="tabs">
  <div class="tab on" id="tabMcq" onclick="setMode('mcq')">選擇題刷題(課程教學與評量)</div>
  <div class="tab" id="tabCard" onclick="setMode('card')">速答卡(學習者發展/教育理念)</div>
</div>
<div class="filters" id="fYear"></div>
<div class="filters hide" id="fSubj">
  <div class="chip on" data-s="all" onclick="setSubj('all')">全部</div>
  <div class="chip" data-s="學" onclick="setSubj('學')">學習者發展</div>
  <div class="chip" data-s="教" onclick="setSubj('教')">教育理念</div>
</div>
<div class="bar">
  <span>進度 <span class="score" id="prog">0/0</span></span>
  <span>✅ <span class="score" id="nOk">0</span></span>
  <span>❌ <span class="score" id="nBad">0</span></span>
  <button class="act ghost" onclick="restart()" style="padding:5px 12px;font-size:12px">重新開始</button>
  <button class="act ghost" onclick="toggleRev()" style="padding:5px 12px;font-size:12px">錯題本</button>
</div>
<div class="rev" id="revBox"></div>
<div id="stage"></div>
<script>
const MCQ=[
{y:113,q:"小中是四年級的身心障礙學生,國語文和數學均有學習功能輕微缺損。課程調整何者較適當?甲、使用數學前一學習階段的學習表現 乙、降低國語文該階段學習內容難度 丙、分解數學該階段學習重點為數個較小的學習內容 丁、轉化國語文學習重點為生活化的學習表現 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"C"},
{y:113,q:"ADHD 三年級生上課專注時間短,欲延長其專注,何項教學措施較適當?(A)忽略分心行為 (B)提供分段學習及活動操作機會 (C)分心時重新教導上課規則 (D)分心時安排到教室後面獨立完成作業",a:"B"},
{y:113,q:"例行收集平時習作和隨堂練習單,分析學習成效並據以調整教學,較符合哪組評量?甲、檔案評量 乙、動態評量 丙、形成性評量 丁、總結性評量 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"A"},
{y:113,q:"九月初剛接任特教班八年級導師,如何執行該班學生的 IEP?(A)檢視已擬定的 IEP,與相關人員討論後微調執行 (B)開學後一個月內訂定 IEP (C)依課表分組分層教學 (D)依學校課程計畫擬定新的 IEP",a:"A"},
{y:113,q:"資源班學生在原班有干擾行為,學校安排特教學生助理人員入班協助上課,屬哪一項課程調整?(A)學習內容 (B)學習歷程 (C)學習環境 (D)學習評量",a:"C"},
{y:113,q:"教學提示策略「由少至多」排序?甲、手指出用具示意拿來 乙、口語詢問下一步驟 丙、示範操作讓學生模仿 丁、手扶著學生的手操作 (A)甲乙丙丁 (B)乙甲丙丁 (C)丙甲丁乙 (D)丁丙甲乙",a:"B"},
{y:113,q:"教挑水果+模擬結帳,之後帶到社區水果店實際購買,採用的評量?(A)真實評量 (B)生態評量 (C)檔案評量 (D)動態評量",a:"A"},
{y:113,q:"注意力短暫、無口語、無法獨立進食、有自傷行為的學生,較需要的教育輔具?甲、生活輔具 乙、溝通輔具 丙、行動輔具 丁、學習輔具 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"A"},
{y:113,q:"教師示範唸口訣列算式→學生逐步接手→最後以內在語言自我引導,屬哪一項教學策略?(A)自我調整 (B)自我監控 (C)自我控制 (D)自我教導",a:"D"},
{y:113,q:"特教生參與普通班活動的課程調整,何者適當?甲、閱讀理解困難者定期評量提供調整後試卷 乙、入班協助時將學生安置教室一角個別指導 丙、特教班學生到普通班上課安排助理人員與同儕協助分組討論 丁、趣味競賽讓肢障生在旁觀看 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"A"},
{y:113,q:"無口語、無法辨識符號、只會指物或拉人的智能障礙幼兒,適合的溝通訓練目標?甲、指認圖片 乙、使用溝通輔具 丙、用手語表達 丁、紙鍵盤溝通策略 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"A"},
{y:113,q:"一年級普通班有配戴助聽器的重度聽障生,較優先的教學調整?甲、安排低噪音教室位置 乙、講課誇大嘴型 丙、教室加裝隔音板 丁、使用調頻系統 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"B"},
{y:113,q:"生態評量的敘述何者較正確?(A)強調標準化程序 (B)目的是了解教學成效 (C)活動設計符合心理年齡 (D)評估環境以學生目前和未來活動的場域為主",a:"D"},
{y:113,q:"不會吃飯如廁、無法口語或手勢表達、會因需求未滿足尖叫,媽媽希望學認數字。何者優先列入學年教育目標?(A)減少尖叫行為 (B)提升生活自理 (C)增進數字認讀 (D)增進需求表達能力",a:"D"},
{y:113,q:"資源班教師與語言治療師共同設計口語表達活動,順序何者較適當?甲、建立詞彙 乙、形成句子 丙、學習語法規則 丁、練習口語技巧 (A)甲乙丁丙 (B)甲丙乙丁 (C)乙甲丁丙 (D)丙甲乙丁",a:"B"},
{y:113,q:"合作諮詢的敘述何者適當?甲、須由特教教師主動開啟議題 乙、討論時盡量少用專業術語 丙、討論內容可作為擬定 IEP 參考 丁、特教教師主要扮演被諮詢者 (A)甲乙 (B)甲丁 (C)乙丙 (D)丙丁",a:"C"},
{y:113,q:"工作角+桌面工作時間表+任務前簡潔口頭提示+完成獲增強物,較符合哪一教學方法?(A)工作分析法 (B)直接教學模式 (C)建構式教學法 (D)結構式教學法",a:"D"},
{y:113,q:"腦麻伴智障生:聽得懂指令、構音困難、右手不佳、左手可操作。適合的教學措施?甲、協助支撐讓右手按鍵盤 乙、潔牙口訣+電動牙刷自行刷牙 丙、語音溝通筆點圖片+句型結構表達 丁、語音溝通板轉文字表達 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"C"},
{y:113,q:"採用工作樣本進行評量,較屬於?(A)動態評量 (B)實作評量 (C)檔案評量 (D)真實評量",a:"B"},
{y:113,q:"學障生識字量七年級水準但常想不起國字怎麼寫、部件錯置,難以邊聽講邊寫重點。較能增進學習成效的輔具?甲、錄音筆 乙、有聲書 丙、溝通板 丁、平板電腦 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"B"},
{y:113,q:"何者符合 UDL 通用設計學習原則?甲、依固定步驟教學 乙、讓學生依擅長方式選擇報告/繪圖/錄影展現成果 丙、高中低組不同實驗任務 丁、文言文教學提供概念圖、雙形式翻譯、課文影片 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"C"},
{y:112,q:"讓不同學生分別學修辭分析/寫段落大意/說出段落意義,是哪一項課程設計?(A)平行式課程 (B)多層次課程 (C)主題統整課程 (D)場地本位課程",a:"B"},
{y:112,q:"哪一項提示策略的線索最少?(A)口語提示下清洗碗盤 (B)教師示範邊看邊洗 (C)照步驟圖打勾完成 (D)自行清洗,教師問「你確定洗乾淨了嗎?」學生檢查確認",a:"D"},
{y:112,q:"自閉症生在不熟悉環境會焦躁不安,較適當的措施?(A)每月一次輔導晤談 (B)避免接觸陌生環境 (C)運用視覺線索理解即將改變的活動行程 (D)每週換座位增進互動",a:"C"},
{y:112,q:"趁語文課教導集中注意力的方法,是將哪一項特殊需求科目融入語文領域?(A)學習策略 (B)社會技巧 (C)生活管理 (D)溝通訓練",a:"A"},
{y:112,q:"IEP 已確定實施,若要調整內容,較適合再次召開會議的時間?(A)本學期結束時 (B)本學年結束時 (C)下學期開學時 (D)隨時皆可",a:"D"},
{y:112,q:"評估特教班一年級智障生溝通技能,較適當做法?甲、教室中蒐集溝通形式 乙、標準化語言測量工具 丙、對主要照顧者進行溝通訪談 丁、觀察同年齡學生社交語言 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"B"},
{y:112,q:"「20 題進位加法,2 分鐘內算對 16 題」評量哪一項能力?(A)正確與時距 (B)速度與程度 (C)時距與程度 (D)正確與速度",a:"D"},
{y:112,q:"學生無法理解應用題題意,老師提供線段圖示輔助,屬哪一項課程調整?(A)學習內容 (B)學習歷程 (C)學習環境 (D)學習評量",a:"B"},
{y:112,q:"善用團體動力、強調學生間相互學習的教學法?甲、直接教學法 乙、交互教學法 丙、合作教學法 丁、合作學習法 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"C"},
{y:112,q:"腦麻生手眼協調不佳且構音不清,哪一項輔助科技較能提升溝通效能?(A)語音生成或語音輸出裝置 (B)平板輸入文字並播放語音 (C)點讀式溝通筆點讀圖片 (D)肢體語言辭典及溝通冊",a:"A"},
{y:112,q:"學習評量敘述何者正確?甲、檔案評量=學生自評 乙、實作評量=實際操作了解歷程與成果 丙、動態評量=評量與教學循環掌握潛能 丁、課程本位評量=同儕互評 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"C"},
{y:112,q:"能讀懂記敘文但說明文理解困難,哪一項學習策略較符合?(A)預測策略 (B)摘要策略 (C)做筆記策略 (D)文章結構策略",a:"D"},
{y:112,q:"視障伴智障生(手勢/實物/圖卡溝通),「聽完故事回答問題」評量調整?甲、點字呈現 乙、以實物為答案選項 丙、二選一選擇 丁、開放式問答 (A)甲乙 (B)甲丁 (C)乙丙 (D)丙丁",a:"C"},
{y:112,q:"AAC 敘述何者正確?甲、手勢和臉部表情屬非輔助性符號 乙、圖像符號大小依視覺和動作技能決定 丙、同時用 AAC 和口語會降低成效 丁、不適宜自閉症學生 (A)甲乙 (B)甲丁 (C)乙丙 (D)丙丁",a:"A"},
{y:112,q:"想增進特教班學生溝通能力,較不適合作為優先選項?(A)申請語言治療師到校訓練口語 (B)營造引發溝通的環境 (C)採替代性溝通方式 (D)加入同學及重要他人誘發溝通",a:"A"},
{y:112,q:"學障生閱讀理解與摘述困難、無法組織想法,適當教學措施?甲、語音輸入軟體摘述大意 乙、自我監控檢核表檢視重點 丙、電腦軟體關鍵字與圖片聯結 丁、電腦軟體文章轉概念構圖 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"D"},
{y:112,q:"課程本位評量較可能得到的資訊?(A)已習得的學習目標 (B)認知策略發展水準 (C)造成學習困難的原因 (D)記憶能力發展水準",a:"A"},
{y:112,q:"IEP 擬定敘述何者較不正確?(A)團隊合作評估並成立小組 (B)經特推會審議不通過達二次者送課發會審議 (C)家長同意後執行,爭議依法書面申訴 (D)參與人員含行政、教師、家長及學生本人",a:"B"},
{y:112,q:"遠距教學中屬於「學習評量」調整者?甲、不會打字改手寫拍照上傳 乙、課前連線測試設備 丙、體育課錄影上傳 丁、實作課改播影片討論 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"B"},
{y:112,q:"數學困難+車禍下肢不便,哪一項課程調整較不適當?(A)功能性動作訓練融入學科 (B)彈性學習課程外加 (C)減少數學時數安排物理治療師抽離訓練 (D)減少數學時數調整為功能性動作訓練",a:"C"},
{y:112,q:"「能利用口語提示協助小楷扭開水龍頭洗手,十次有八次正確」目標撰寫的問題?(A)行為動詞欠具體 (B)未敘明評量標準 (C)非學生導向的行為表現 (D)情境不明確",a:"C"},
{y:112,q:"腦麻伴智障十年級生盼畢業直接就業,優先列入學年教育目標?(A)便利商店全職 (B)能接受他人的指令完成工作 (C)資訊科技找就業資訊 (D)庇護工場兼職",a:"B"},
{y:112,q:"教導整理個人物品後,檢核能否依正確步驟完成整理抽屜,屬何種評量?(A)真實評量 (B)檔案評量 (C)生態評量 (D)功能行為評量",a:"A"},

"自我倡導=認識自己+為自己發聲:找自己喜歡的工作(丙)+參與自己的 IEP 會議(丁)。購物與自理是獨立生活技能。",
"CBM 計分看「正確+速率」(如每分鐘正確朗讀字數);材料取自當級課程,施測頻率高但無固定兩次規定。",
"錯誤類型分析後→教「自我檢視是否需要借位」的策略,針對錯誤模式補救;過度練習與口訣沒處理錯誤根源。",
"同一節數學課,小華做較簡單版本的同領域任務(分糖果)=多層次課程。",
"反義詞填空+類比推理考的是詞彙意義關係=語意;語法是詞序結構、語用是情境使用。",
"乙(依學生反應調整策略=歷程)+丙(簡化減量分解替代重整=學習重點調整)正確;學習環境不只物理安全,評量調整也不限考試服務辦法。",
"簡化=降低難度但保留目標:寫課文大意→看圖說大意;10 題改 5 題是減量,寫改說是替代,分段閱讀是分解。",
"擬計畫→照計畫執行→自我評量=計畫、監控、評鑑三件套=後設認知策略。",
"配合優勢能力(圖像好)+處理核心困難(理解):用不同圖像重組學習內容,最符合現況的年度目標。",
"新舊複習→示範→引導練習→獨立練習到精熟,腳本化、小步驟、高回應=直接教學模式(DI)。",
"生態評量正確組合:比較個人能力與環境需求的差距(甲)+針對個人週遭環境評量(丙);家庭訪問只是可用方法之一。",
"由多到少:肢體(牽著過)→示範→口語問句引發(「綠燈亮要怎麼做?」)→自然線索(指紅綠燈等反應),逐步褪除。",
"提示-示範法:先用「告訴我,你要什麼?」提示,學生反應不完整再示範「我要玩拼圖」讓其仿說——先提示後示範。",
"課綱學習重點調整的歸類題:官方組合為乙丙;記住五法定義——簡化(降難度)、減量(減份量)、分解(拆步驟)、替代(換方式)、重整(重新組織)。"
];

MCQ.forEach((q,i)=>{if(EXPL[i])q.e=EXPL[i];});

let mode='mcq', subj='all', yearSel='all';
let pool=[], idx=0, ok=0, bad=0, wrongs=[];
const LS='jamesExamQuiz';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildYearChips(){
  const ys=['all',113,112,111];
  document.getElementById('fYear').innerHTML=ys.map(y=>
    `<div class="chip ${y==yearSel?'on':''}" onclick="setYear('${y}')">${y=='all'?'全部年度':y+' 年'}</div>`).join('');
}
function setMode(m){mode=m;
  document.getElementById('tabMcq').classList.toggle('on',m=='mcq');
  document.getElementById('tabCard').classList.toggle('on',m=='card');
  document.getElementById('fSubj').classList.toggle('hide',m=='mcq');
  restart();}
function setYear(y){yearSel=y;restart();}
function setSubj(s){subj=s;
  document.querySelectorAll('#fSubj .chip').forEach(c=>c.classList.toggle('on',c.dataset.s==s));
  restart();}
function restart(){
  buildYearChips();
  let src=mode=='mcq'?MCQ:CARDS;
  pool=src.filter(q=>(yearSel=='all'||q.y==yearSel)&&(mode=='mcq'||subj=='all'||q.s==subj));
  pool=shuffle(pool.slice());
  idx=0;ok=0;bad=0;wrongs=[];
  document.getElementById('revBox').classList.remove('show');
  render();}
function upd(){
  document.getElementById('prog').textContent=Math.min(idx+1,pool.length)+'/'+pool.length;
  document.getElementById('nOk').textContent=ok;
  document.getElementById('nBad').textContent=bad;
  try{localStorage.setItem(LS,JSON.stringify({ok,bad,total:pool.length,mode,ts:Date.now()}))}catch(e){}}
function render(){
  const st=document.getElementById('stage');
  if(idx>=pool.length){
    const pct=pool.length?Math.round(ok/pool.length*100):0;
    st.innerHTML=`<div class="card done"><h2>${pct>=80?'🎉':pct>=60?'💪':'📚'} 完成!正確率 ${pct}%</h2>
    <p style="color:var(--sub);margin-bottom:16px">答對 ${ok} 題.答錯 ${bad} 題${bad?'.點「錯題本」複習':''}</p>
    <button class="act" onclick="restart()">再刷一輪</button></div>`;
    upd();return;}
  const q=pool[idx];
  if(mode=='mcq'){
    st.innerHTML=`<div class="card">
      <div class="qmeta"><span class="pill">${q.y} 年</span>課程教學與評量.第 ${idx+1} 題</div>
      <div class="qtext">${q.q}</div>
      <div class="opts">${['A','B','C','D'].map(o=>`<button class="opt" id="op${o}" onclick="pick('${o}')">${o}</button>`).join('')}</div>
      <div class="ansbox" id="ab"></div>
      <div class="row" style="margin-top:12px"><button class="act hide" id="nx" onclick="next()">下一題 →</button></div>
    </div>`;
  }else{
    st.innerHTML=`<div class="card">
      <div class="qmeta"><span class="pill">${q.y} 年</span>${q.s=='學'?'學習者發展與適性輔導':'教育理念與實務'}.第 ${idx+1} 張</div>
      <div class="cardq">${q.q}</div>
      <div class="carda" id="ca">💡 ${q.a}</div>
      <div class="row">
        <button class="act ghost" id="flip" onclick="flip()">看答案</button>
        <span id="judge" class="hide">
          <button class="act" style="background:var(--ok)" onclick="mark(true)">答對 ✓</button>
          <button class="act" style="background:var(--bad)" onclick="mark(false)">答錯 ✗</button>
        </span>
      </div>
    </div>`;}
  upd();}
function pick(o){
  const q=pool[idx];
  ['A','B','C','D'].forEach(x=>document.getElementById('op'+x).disabled=true);
  const ab=document.getElementById('ab');
  const ex=q.e?'\n💡 '+q.e:'';
  if(o==q.a){ok++;document.getElementById('op'+o).classList.add('right');
    ab.className='ansbox show ok';ab.style.whiteSpace='pre-wrap';ab.textContent='✅ 答對!官方答案 '+q.a+ex;}
  else{bad++;wrongs.push(q);
    document.getElementById('op'+o).classList.add('wrong');
    document.getElementById('op'+q.a).classList.add('right');
    ab.className='ansbox show bad';ab.style.whiteSpace='pre-wrap';ab.textContent='❌ 官方答案是 '+q.a+ex;}
  document.getElementById('nx').classList.remove('hide');upd();}
function flip(){document.getElementById('ca').classList.add('show');
  document.getElementById('flip').classList.add('hide');
  document.getElementById('judge').classList.remove('hide');}
function mark(good){const q=pool[idx];
  if(good)ok++;else{bad++;wrongs.push(q);}
  idx++;render();}
function next(){idx++;render();}
function toggleRev(){
  const rb=document.getElementById('revBox');
  if(rb.classList.contains('show')){rb.classList.remove('show');return;}
  rb.innerHTML=wrongs.length?'<b>❌ 本輪錯題('+wrongs.length+')</b><br>'+
    wrongs.map(w=>'<div style="margin-top:8px">'+(w.y?'['+w.y+'] ':'')+w.q.slice(0,80)+'…<br><b>→ '+(w.a.length>1?w.a:'答案 '+w.a)+'</b></div>').join('')
    :'目前沒有錯題 🎉';
  rb.classList.add('show');}
buildYearChips();restart();
</script>
</body>
</html>
