<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教檢刷題|特教身障組</title>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--card:#fff;--ink:#1f2937;--sub:#6b7280;--acc:#2563eb;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);padding:16px;max-width:760px;margin:0 auto}
h1{font-size:18px;margin-bottom:4px}
.sub{color:var(--sub);font-size:12px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px;color:var(--sub)}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:bold}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.qmeta{font-size:12px;color:var(--sub);margin-bottom:8px}
.qtext{font-size:15px;line-height:1.8;margin-bottom:14px;white-space:pre-wrap}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:60px;padding:12px 0;text-align:center;font-size:16px;font-weight:bold;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.right{background:#dcfce7;border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:#fee2e2;border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.ansbox{margin-top:12px;padding:12px;border-radius:8px;font-size:14px;line-height:1.7;display:none;white-space:pre-wrap}
.ansbox.show{display:block}
.ansbox.ok{background:#dcfce7;color:#166534}
.ansbox.bad{background:#fee2e2;color:#991b1b}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.score{font-weight:bold;color:var(--ink)}
button.act{padding:10px 18px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:14px;cursor:pointer}
button.ghost{background:var(--card);color:var(--acc);border:1px solid var(--acc)}
.rev{margin-top:14px;padding:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:13px;line-height:1.7;display:none}
.rev.show{display:block}
.rev b{color:#92400e}
.cardq{font-size:15px;line-height:1.8;margin-bottom:14px}
.carda{font-size:14px;line-height:1.7;padding:12px;background:#eff6ff;border-radius:8px;color:#1e40af;display:none;margin-bottom:12px;white-space:pre-wrap}
.carda.show{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hide{display:none!important}
.done{text-align:center;padding:30px 10px}
.done h2{font-size:22px;margin-bottom:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#eef2ff;color:#4338ca;margin-right:6px}
</style>
</head>
<body>
<h1>📝 教檢刷題|特教身障組</h1>
<div class="sub">官方試題(tqa.rcpet.edu.tw)111–115 年.答案為官方版.問答題要點為 AI 整理供參</div>
<div class="tabs">
  <div class="tab on" id="tabMcq" onclick="setMode('mcq')">選擇題</div>
  <div class="tab" id="tabCard" onclick="setMode('card')">速答卡</div>
  <div class="tab" id="tabEssay" onclick="setMode('essay')">問答題</div>
</div>
<div class="filters" id="fYear"></div>
<div class="filters" id="fSubj"></div>
<div class="bar">
  <span>進度 <span class="score" id="prog">0/0</span></span>
  <span>✅ <span class="score" id="nOk">0</span></span>
  <span>❌ <span class="score" id="nBad">0</span></span>
  <button class="act ghost" onclick="restart()" style="padding:5px 12px;font-size:12px">重新開始</button>
  <button class="act ghost" onclick="toggleRev()" style="padding:5px 12px;font-size:12px">錯題本</button>
</div>
<div class="rev" id="revBox"></div>
<div id="stage"></div>
<script>
const MCQ=[
{y:113,q:"小中是四年級的身心障礙學生,國語文和數學均有學習功能輕微缺損。課程調整何者較適當?甲、使用數學前一學習階段的學習表現 乙、降低國語文該階段學習內容難度 丙、分解數學該階段學習重點為數個較小的學習內容 丁、轉化國語文學習重點為生活化的學習表現 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"C"},
{y:113,q:"ADHD 三年級生上課專注時間短,欲延長其專注,何項教學措施較適當?(A)忽略分心行為 (B)提供分段學習及活動操作機會 (C)分心時重新教導上課規則 (D)分心時安排到教室後面獨立完成作業",a:"B"},
{y:113,q:"例行收集平時習作和隨堂練習單,分析學習成效並據以調整教學,較符合哪組評量?甲、檔案評量 乙、動態評量 丙、形成性評量 丁、總結性評量 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"A"},
{y:113,q:"九月初剛接任特教班八年級導師,如何執行該班學生的 IEP?(A)檢視已擬定的 IEP,與相關人員討論後微調執行 (B)開學後一個月內訂定 IEP (C)依課表分組分層教學 (D)依學校課程計畫擬定新的 IEP",a:"A"},
{y:113,q:"資源班學生在原班有干擾行為,學校安排特教學生助理人員入班協助上課,屬哪一項課程調整?(A)學習內容 (B)學習歷程 (C)學習環境 (D)學習評量",a:"C"},
{y:113,q:"教學提示策略「由少至多」排序?甲、手指出用具示意拿來 乙、口語詢問下一步驟 丙、示範操作讓學生模仿 丁、手扶著學生的手操作 (A)甲乙丙丁 (B)乙甲丙丁 (C)丙甲丁乙 (D)丁丙甲乙",a:"B"},
{y:113,q:"教挑水果+模擬結帳,之後帶到社區水果店實際購買,採用的評量?(A)真實評量 (B)生態評量 (C)檔案評量 (D)動態評量",a:"A"},
{y:113,q:"注意力短暫、無口語、無法獨立進食、有自傷行為的學生,較需要的教育輔具?甲、生活輔具 乙、溝通輔具 丙、行動輔具 丁、學習輔具 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"A"},
{y:113,q:"教師示範唸口訣列算式→學生逐步接手→最後以內在語言自我引導,屬哪一項教學策略?(A)自我調整 (B)自我監控 (C)自我控制 (D)自我教導",a:"D"},
{y:113,q:"特教生參與普通班活動的課程調整,何者適當?甲、閱讀理解困難者定期評量提供調整後試卷 乙、入班協助時將學生安置教室一角個別指導 丙、特教班學生到普通班上課安排助理人員與同儕協助分組討論 丁、趣味競賽讓肢障生在旁觀看 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"A"},
{y:113,q:"無口語、無法辨識符號、只會指物或拉人的智能障礙幼兒,適合的溝通訓練目標?甲、指認圖片 乙、使用溝通輔具 丙、用手語表達 丁、紙鍵盤溝通策略 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"A"},
{y:113,q:"一年級普通班有配戴助聽器的重度聽障生,較優先的教學調整?甲、安排低噪音教室位置 乙、講課誇大嘴型 丙、教室加裝隔音板 丁、使用調頻系統 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"B"},
{y:113,q:"生態評量的敘述何者較正確?(A)強調標準化程序 (B)目的是了解教學成效 (C)活動設計符合心理年齡 (D)評估環境以學生目前和未來活動的場域為主",a:"D"},
{y:113,q:"不會吃飯如廁、無法口語或手勢表達、會因需求未滿足尖叫,媽媽希望學認數字。何者優先列入學年教育目標?(A)減少尖叫行為 (B)提升生活自理 (C)增進數字認讀 (D)增進需求表達能力",a:"D"},
{y:113,q:"資源班教師與語言治療師共同設計口語表達活動,順序何者較適當?甲、建立詞彙 乙、形成句子 丙、學習語法規則 丁、練習口語技巧 (A)甲乙丁丙 (B)甲丙乙丁 (C)乙甲丁丙 (D)丙甲乙丁",a:"B"},
{y:113,q:"合作諮詢的敘述何者適當?甲、須由特教教師主動開啟議題 乙、討論時盡量少用專業術語 丙、討論內容可作為擬定 IEP 參考 丁、特教教師主要扮演被諮詢者 (A)甲乙 (B)甲丁 (C)乙丙 (D)丙丁",a:"C"},
{y:113,q:"工作角+桌面工作時間表+任務前簡潔口頭提示+完成獲增強物,較符合哪一教學方法?(A)工作分析法 (B)直接教學模式 (C)建構式教學法 (D)結構式教學法",a:"D"},
{y:113,q:"腦麻伴智障生:聽得懂指令、構音困難、右手不佳、左手可操作。適合的教學措施?甲、協助支撐讓右手按鍵盤 乙、潔牙口訣+電動牙刷自行刷牙 丙、語音溝通筆點圖片+句型結構表達 丁、語音溝通板轉文字表達 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"C"},
{y:113,q:"採用工作樣本進行評量,較屬於?(A)動態評量 (B)實作評量 (C)檔案評量 (D)真實評量",a:"B"},
{y:113,q:"學障生識字量七年級水準但常想不起國字怎麼寫、部件錯置,難以邊聽講邊寫重點。較能增進學習成效的輔具?甲、錄音筆 乙、有聲書 丙、溝通板 丁、平板電腦 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"B"},
{y:113,q:"何者符合 UDL 通用設計學習原則?甲、依固定步驟教學 乙、讓學生依擅長方式選擇報告/繪圖/錄影展現成果 丙、高中低組不同實驗任務 丁、文言文教學提供概念圖、雙形式翻譯、課文影片 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"C"},
{y:112,q:"讓不同學生分別學修辭分析/寫段落大意/說出段落意義,是哪一項課程設計?(A)平行式課程 (B)多層次課程 (C)主題統整課程 (D)場地本位課程",a:"B"},
{y:112,q:"哪一項提示策略的線索最少?(A)口語提示下清洗碗盤 (B)教師示範邊看邊洗 (C)照步驟圖打勾完成 (D)自行清洗,教師問「你確定洗乾淨了嗎?」學生檢查確認",a:"D"},
{y:112,q:"自閉症生在不熟悉環境會焦躁不安,較適當的措施?(A)每月一次輔導晤談 (B)避免接觸陌生環境 (C)運用視覺線索理解即將改變的活動行程 (D)每週換座位增進互動",a:"C"},
{y:112,q:"趁語文課教導集中注意力的方法,是將哪一項特殊需求科目融入語文領域?(A)學習策略 (B)社會技巧 (C)生活管理 (D)溝通訓練",a:"A"},
{y:112,q:"IEP 已確定實施,若要調整內容,較適合再次召開會議的時間?(A)本學期結束時 (B)本學年結束時 (C)下學期開學時 (D)隨時皆可",a:"D"},
{y:112,q:"評估特教班一年級智障生溝通技能,較適當做法?甲、教室中蒐集溝通形式 乙、標準化語言測量工具 丙、對主要照顧者進行溝通訪談 丁、觀察同年齡學生社交語言 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"B"},
{y:112,q:"「20 題進位加法,2 分鐘內算對 16 題」評量哪一項能力?(A)正確與時距 (B)速度與程度 (C)時距與程度 (D)正確與速度",a:"D"},
{y:112,q:"學生無法理解應用題題意,老師提供線段圖示輔助,屬哪一項課程調整?(A)學習內容 (B)學習歷程 (C)學習環境 (D)學習評量",a:"B"},
{y:112,q:"善用團體動力、強調學生間相互學習的教學法?甲、直接教學法 乙、交互教學法 丙、合作教學法 丁、合作學習法 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"C"},
{y:112,q:"腦麻生手眼協調不佳且構音不清,哪一項輔助科技較能提升溝通效能?(A)語音生成或語音輸出裝置 (B)平板輸入文字並播放語音 (C)點讀式溝通筆點讀圖片 (D)肢體語言辭典及溝通冊",a:"A"},
{y:112,q:"學習評量敘述何者正確?甲、檔案評量=學生自評 乙、實作評量=實際操作了解歷程與成果 丙、動態評量=評量與教學循環掌握潛能 丁、課程本位評量=同儕互評 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"C"},
{y:112,q:"能讀懂記敘文但說明文理解困難,哪一項學習策略較符合?(A)預測策略 (B)摘要策略 (C)做筆記策略 (D)文章結構策略",a:"D"},
{y:112,q:"視障伴智障生(手勢/實物/圖卡溝通),「聽完故事回答問題」評量調整?甲、點字呈現 乙、以實物為答案選項 丙、二選一選擇 丁、開放式問答 (A)甲乙 (B)甲丁 (C)乙丙 (D)丙丁",a:"C"},
{y:112,q:"AAC 敘述何者正確?甲、手勢和臉部表情屬非輔助性符號 乙、圖像符號大小依視覺和動作技能決定 丙、同時用 AAC 和口語會降低成效 丁、不適宜自閉症學生 (A)甲乙 (B)甲丁 (C)乙丙 (D)丙丁",a:"A"},
{y:112,q:"想增進特教班學生溝通能力,較不適合作為優先選項?(A)申請語言治療師到校訓練口語 (B)營造引發溝通的環境 (C)採替代性溝通方式 (D)加入同學及重要他人誘發溝通",a:"A"},
{y:112,q:"學障生閱讀理解與摘述困難、無法組織想法,適當教學措施?甲、語音輸入軟體摘述大意 乙、自我監控檢核表檢視重點 丙、電腦軟體關鍵字與圖片聯結 丁、電腦軟體文章轉概念構圖 (A)甲丙 (B)甲丁 (C)乙丙 (D)乙丁",a:"D"},
{y:112,q:"課程本位評量較可能得到的資訊?(A)已習得的學習目標 (B)認知策略發展水準 (C)造成學習困難的原因 (D)記憶能力發展水準",a:"A"},
{y:112,q:"IEP 擬定敘述何者較不正確?(A)團隊合作評估並成立小組 (B)經特推會審議不通過達二次者送課發會審議 (C)家長同意後執行,爭議依法書面申訴 (D)參與人員含行政、教師、家長及學生本人",a:"B"},
{y:112,q:"遠距教學中屬於「學習評量」調整者?甲、不會打字改手寫拍照上傳 乙、課前連線測試設備 丙、體育課錄影上傳 丁、實作課改播影片討論 (A)甲乙 (B)甲丙 (C)乙丁 (D)丙丁",a:"B"},
{y:112,q:"數學困難+車禍下肢不便,哪一項課程調整較不適當?(A)功能性動作訓練融入學科 (B)彈性學習課程外加 (C)減少數學時數安排物理治療師抽離訓練 (D)減少數學時數調整為功能性動作訓練",a:"C"},
{y:112,q:"「能利用口語提示協助小楷扭開水龍頭洗手,十次有八次正確」目標撰寫的問題?(A)行為動詞欠具體 (B)未敘明評量標準 (C)非學生導向的行為表現 (D)情境不明確",a:"C"},
{y:112,q:"腦麻伴智障十年級生盼畢業直接就業,優先列入學年教育目標?(A)便利商店全職 (B)能接受他人的指令完成工作 (C)資訊科技找就業資訊 (D)庇護工場兼職",a:"B"},
{y:112,q:"教導整理個人物品後,檢核能否依正確步驟完成整理抽屜,屬何種評量?(A)真實評量 (B)檔案評量 (C)生態評量 (D)功能行為評量",a:"A"},

{s:"課",y:115,q:"【非選】大彥六年級,聽覺理解識字正常但寫字與閱讀理解困難,無法摘要課文重要訊息。試說明摘要策略的定義(2分),並依其能力現況列舉兩項摘要策略,說明內容與理由(8分)。",a:"定義:從文本中辨識重要訊息、刪除冗餘、歸納主旨並以精簡語句重述的理解監控策略。策略一:刪除-歸納-主題句法(刪瑣碎/重複→歸納同類→找或寫主題句),配合他識字正常的優勢用口說完成,避開書寫弱點。策略二:文章結構圖(故事體用故事文法/說明文用結構框架),以視覺組織圖填關鍵詞,降低書寫量又能呈現理解。"},
{s:"課",y:115,q:"【非選】樂樂棒球:小美認知理解與序列記憶困難;小毅下肢受限坐輪椅、可揮擊但力量不強。針對兩項學習目標(理解規則/擊球後跑壘接傳),各選一項優先調整的目標,寫出調整後目標及理由。",a:"小美→目標一調整:「能在圖卡步驟提示下,依序說出並做出打擊→跑壘的流程」——用視覺步驟卡補償序列記憶。小毅→目標二調整:「擊中球後能自行操作輪椅完成上壘(或由同儕依規則代跑),並能將球傳給近距離隊友」——保留參與核心、以輔具與規則調整替代跑壘。理由都指向:保留目標功能、調整表現方式(合理調整)。"},
{s:"課",y:115,q:"【非選】大如八年級身體病弱(腦瘤術後,右半側肢體及感官受限,受藥物影響)。如何規劃其課程與支持?",a:"要點:①健康照護優先:與醫療端合作,彈性出席與作業量(合理調整)②學習面:優勢側輔具+書寫替代(語音輸入/電腦)③課程調整:簡化減量+重點化,疲勞管理安排休息 ④心理社會支持:同儕理解、情緒支持 ⑤評量調整:延長時間、口試替代。"},
{s:"課",y:114,q:"【非選】低能力組學生記憶弱、無法完成一連串指令。試列舉四項能增進國語文學習的記憶策略並舉例。",a:"①複誦策略:生字詞多感官複誦(看-唸-寫三遍)②意義化/聯想:字族文、部件故事(「青」家族:清、晴、請)③組織化:語意圖把課文詞彙分類群組 ④心像法:把課文內容轉成圖像或動作 ⑤(可加)口訣化+分段呈現指令,一次一步。"},
{s:"課",y:114,q:"【非選】大中七年級,全身肌肉萎縮、依賴他人協助行動進食穿衣如廁,能理解指令但口語表達困難。列舉四項教育輔具+各一項設備及使用理由。",a:"①溝通輔具:語音輸出溝通裝置(SGD)/眼控溝通系統——口語困難,以科技替代表達。②擺位/行動輔具:擺位輪椅+頭靠軀幹支撐——維持姿勢參與課堂。③電腦輔具:特殊開關+掃描輸入或眼控滑鼠——動作受限仍可操作學習。④生活輔具:進食輔助器具(彎柄湯匙/防滑碗)——提升進食參與。"},
{s:"課",y:114,q:"【非選】王老師教特教班學生辨識廁所標誌,採前事策略及後果策略幫助類化。說明兩種策略定義(4分)+依教學目標各舉兩例(6分)。",a:"前事策略:行為發生「前」安排環境與提示以促發正確反應——例:①教室到廁所沿路貼標誌提示卡 ②教學時使用多種真實標誌照片(男女/無障礙/不同場所)做多元範例。後果策略:行為「後」給予後果以強化維持——例:①正確辨識並走到正確廁所立即具體讚美+代幣 ②在社區實地正確找到廁所時給予自然增強(如廁+喜愛活動)。"},
{s:"課",y:113,q:"【非選】說明「心智圖」與「自我提問」兩項學習策略的定義,並說明如何運用於閱讀理解教學。",a:"心智圖:以中心主題向外放射分支,用關鍵詞與圖像組織訊息——閱讀後讓學生把課文人事時地物/因果畫成圖,外化文章結構。自我提問:學生在閱讀前中後對自己提出並回答問題(6W)監控理解——教師先示範提問→引導練習→獨立使用,從事實性問題進到推論性問題。"},
{s:"課",y:113,q:"【非選】依個案能力現況,為其開設特殊需求領域科目並撰寫具體學年目標(常考:大緯/大強/大美型個案)。",a:"公式:①依現況缺口選科目(注意力組織→學習策略;人際→社會技巧;自理→生活管理;無口語→溝通訓練)②目標=條件+學生+行為動詞+標準,例:「在提供檢核表的情境下,大緯能自行完成回家作業記錄,連續四週達成率 80%」。科目名稱要用九科正式名稱。"},
{s:"課",y:113,q:"【非選】小明需要的四項支持服務類型並各舉一例。",a:"①人力支持:特教學生助理人員協助課堂參與 ②輔具服務:溝通輔具/擺位輔具 ③適性教材:放大字體、易讀版、數位教材 ④無障礙環境:動線、廁所、教室位置調整。(法源:特殊教育法支持服務+CRPD 合理之對待)"},
{s:"課",y:112,q:"【非選】列舉四項「類化」教學策略並說明。",a:"①多元範例教學:多種材料/人物/情境輪流教 ②真實情境教學:社區本位實地練習 ③自然後果增強:讓正確反應獲得自然結果 ④逐步褪除提示:從高支持到自然線索 ⑤安排不同教學者與場所(跨人事地類化檢核)。"},
{s:"課",y:112,q:"【非選】便利商店購物的課程設計原則(集中式特教班)。",a:"①生態評量決定教學內容(該社區、該店實際流程)②工作分析:選物→結帳→付錢→找零→包裝分步教學 ③模擬→實地漸進,提示逐步褪除 ④融入功能性學科(金錢計算、標誌識讀)⑤以真實評量檢核(檢核表記錄實地表現)。"},
{s:"課",y:111,q:"【非選】合作教學的四種模式並說明。",a:"①團隊式教學:兩師共同主導輪流授課 ②平行式教學:分兩半組教相同內容 ③分站式教學:設站輪替,各師負責一站 ④替代式(差異式)教學:一師帶大組、一師帶小組進行補救或加深。(第五種:一主教一協助)"},
{s:"課",y:111,q:"【非選】多重障礙學生的教材教法設計原則各四項。",a:"教材:①功能性/生活化 ②依生態評量選材 ③多感官呈現 ④結構化與視覺化。教法:①工作分析小步驟 ②提示系統與褪除 ③部分參與原則 ④輔助科技介入(AAC/擺位/開關)。"},
{s:"學",y:115,q:"【非選】阿偉重複朗讀訓練紀錄:第一課 200字錯40唸240秒;第二課 300字錯40唸400秒;第三課 430字錯25唸405秒。(1)判斷訓練是否有效並說明理由(4分)(2)評估書寫問題,列舉兩項評估項目及理由(6分)。",a:"(1)有效。計算每分鐘正確字數(WCPM):第一課(200-40)/4=40字/分;第二課(300-40)/6.7≈39;第三課(430-25)/6.75=60字/分——正確率(80%→94%)與流暢度皆上升。(2)①寫字品質/正確性評估(抄寫與聽寫,看筆順、部件、左右顛倒)——區分是動作或字形表徵問題;②書寫流暢性(限時寫字數)與寫作內容評估(句子結構)——判斷困難層級(寫字 vs 寫作)。"},
{s:"學",y:115,q:"【非選】針對一般智能資優之身心障礙學生(2E),從「評量項目」及「評量程序」各提出兩項評量調整做法。",a:"評量項目:①採用非語文/流體智力測驗替代高語文負荷測驗(如聽障用非語文智測)②增加多元資料:實作、作品集、觀察與提名。評量程序:①調整施測方式(延長時間、分段施測、報讀、輔具作答)②調整分數採計/常模比較方式(依障礙特質解釋分數,優勢分數加權)。"},
{s:"學",y:115,q:"【非選】自閉症小華遇挫折會暴怒、尖叫、跑出教室甚至衝出學校。擬定正向行為支持中「行為前、中、後」的危機處理階段策略。",a:"前(預防):辨識前兆訊號(音量、動作)→預告變動、提供冷靜角與情緒溫度計、教替代溝通(求助卡)。中(危機處理):保持冷靜低刺激、簡短指令、移除圍觀與危險物、依危機處理計畫由指定人員陪同至安全區、必要時啟動校安通報防跑出校園(門禁協調)。後(復原檢討):情緒平復後再教導(復盤觸發點→練習替代行為)、記錄 ABC 檢討方案、與家長及團隊修正 BIP。"},
{s:"學",y:114,q:"【非選】疑似學障生鑑定前資料蒐集:對應鑑定基準提出佐證資料並簡述理由(內在能力顯著差異/一般教育介入難改善)。",a:"①個人內在能力顯著差異→佐證:個別智力測驗+聽說讀寫算成就測驗的組型比較;理由:呈現智力正常但特定領域顯著低落的差距。②經一般教育介入仍難改善→佐證:轉介前介入紀錄(補救教學出缺席、教學調整內容、前後測成長曲線);理由:證明已提供有效介入仍反應不佳(RTI 精神)。"},
{s:"學",y:114,q:"【非選】自閉症資優生阿元(數學優異、社交與情緒困難),依 RTI 結合資優與身障資源班,規劃其學習與輔導。",a:"階層一:普通班全方位設計+差異化數學任務;階層二:資優資源班小組充實(專題探究)+身障資源班社會技巧小組;階層三:個別化密集介入(情緒調節個別輔導、雙特個案會議整合 IEP 與資優方案)。核心:優勢發展與弱勢支持並行,定期進展監控決定升降階層。"},
{s:"學",y:113,q:"【非選】資源班教師的三大類工作內容(法規)。",a:"①評量與鑑定:轉介前介入、施測、現況分析 ②教學:抽離/外加課程、課程調整與特殊需求科目 ③諮詢與支持:普通班教師/家長諮詢、入班輔導、IEP 整合與轉銜。"},
{s:"學",y:113,q:"【非選】個案行為的 ABC 分析:說明 A-B-C 的定義並舉例如何蒐集資料。",a:"A 前事(行為前的情境/觸發)、B 行為(可觀察可測量的具體描述)、C 後果(行為後獲得/逃避了什麼)。蒐集:①ABC 軼事紀錄表直接觀察 ②散布圖找高頻時段 ③訪談教師家長(MAS/FAST 量表)→形成功能假設(獲得注意/實物/逃避/感官)。"},
{s:"學",y:112,q:"【非選】資優學生完美主義:特徵與輔導策略四項。",a:"特徵:過高自我標準、怕失敗而拖延或不交、對錯誤過度反應。輔導:①認知重建(錯誤=學習訊息)②設定「夠好」標準與分段目標 ③示範與討論失敗經驗(楷模)④聚焦歷程的回饋而非結果 ⑤放鬆與情緒調節訓練。"},
{s:"學",y:111,q:"【非選】轉銜服務的法定項目。",a:"依各教育階段需求含:升學輔導、生活、就業、心理輔導、福利服務及其他相關專業服務;原則:轉銜會議+資料移轉(入學後追蹤),跨階段於畢業前召開。"},
{s:"教",y:115,q:"【非選】小寧在「高薪但違背理念」與「符合教育理念」的工作間猶豫。分別從存在主義與實用主義的核心觀點,說明職涯考量重點。",a:"存在主義:存在先於本質、人透過自由選擇定義自己並承擔責任→考量重點:忠於自我的價值選擇,勇於承擔選擇的焦慮與後果,活出本真。實用主義:知識與價值在行動結果中檢驗、經驗不斷重組→考量重點:實際嘗試(實習/兼職)驗證哪條路帶來成長與問題解決的效用,依經驗結果調整方向。"},
{s:"教",y:115,q:"【非選】教師性別比率統計表(幼兒園女性 97.97%、國小校長男性 67.62%…):分析現象並提出學校教育因應。",a:"現象:①教職性別隔離——教育階段越低女性越多(照顧=女性的性別角色期待)②垂直隔離/玻璃天花板——教師多女性但校長多男性。因應:①課程融入性平教育破除職業刻板 ②提供多元性別楷模(男性幼教師/女性領導者)③檢視甄選與晉升制度的隱性偏誤。"},
{s:"教",y:114,q:"【非選】傅柯「規訓」與教室座位安排:說明兩種座位(排排坐 vs 分組)的監視方式及效果,並擇一說明適用情境。",a:"排排坐(全景敞視式):教師單點可見全體,學生自覺被看而自我規訓——效果:秩序與專注,利講述與評量。分組座位(相互可見):監視分散於同儕互視,規範經由團體內化——效果:互動與合作,也產生同儕壓力。適用:講述/測驗用排排坐;探究討論用分組——依教學目標選擇。"},
{s:"教",y:114,q:"【非選】文化資本造成階級再製的兩項原因+「文化雜食」為何可能是新的優勢文化資本?",a:"原因:①學校課程與評量預設中上階級的語言符碼與文化經驗,擁有者如魚得水 ②文化資本可透過家庭日常薰陶累積並轉換為學歷(制度化),弱勢家庭難以複製。文化雜食:上層不僅懂高雅文化還能跨界欣賞大眾文化,展現「跨域鑑賞力」——這種彈性與廣度本身成為新的區辨(distinction)標誌,反而再劃出階級界線。"},
{s:"教",y:113,q:"【非選】「善意的謊言」:分別以義務論與效益論論述。",a:"義務論(康德):誠實是無條件的道德義務,說謊把他人當工具、違反可普遍化原則→即使善意也不應說謊。效益論:行為對錯看結果總效益→若謊言能防止更大傷害、增進整體幸福,則可被證成。收尾:教育現場可再引入德行論(誠實品格)與關懷倫理(關係脈絡)補充。"},
{s:"教",y:113,q:"【非選】暑期學習落差圖(勞動 vs 中產階級):結論、原因與學校教師因應。",a:"結論:學期中兩群成長相近,暑假中產持續成長、勞動階級停滯甚至下滑(暑期滑落 summer setback)→差距主要來自校外資源。原因:家庭文化資本與暑期活動(閱讀、營隊)差異。因應:①暑期課輔/閱讀計畫優先弱勢 ②圖書資源開放與借閱 ③親職支持與社區資源連結。"},
{s:"教",y:113,q:"【非選】Herzberg 雙因子理論:激勵/保健因子意涵+提升教師兼任行政意願的做法。",a:"保健因子:薪資、制度、工作環境——不足會不滿,但充足只消除不滿。激勵因子:成就感、被賞識、成長與責任——才能帶來滿意與投入。做法:①減課/行政減量+合理職務加給(保健)②賦權與專業成長機會、公開肯定行政貢獻(激勵)。"},
{s:"教",y:112,q:"【非選】教師輔導與管教辦法之「一般管教措施」列舉五項。",a:"口頭糾正、調整座位、要求口頭道歉或書面自省、列入日常表現紀錄、通知法定代理人協請處理、要求課餘從事可完成之合理輔導性任務、適當增加作業或練習(擇五)。禁止:體罰、誹謗、連坐。"},
{s:"教",y:112,q:"【非選】教育的工具性價值與非工具性價值:意涵+學校教育各一例。",a:"工具性:教育作為達成外在目的的手段——例:技職課程培養就業能力、考試升學。非工具性(內在):教育歷程本身即有價值——例:美感課程的欣賞體驗、為求知而求知的探究課。理想的學校教育兩者兼顧。"},
{s:"教",y:111,q:"【非選】後現代主義的教育目的兩項+課程與教學啟示三項。",a:"目的:①培養尊重差異、欣賞多元的主體 ②培養批判反思與解構宏大敘事的能力。啟示:①課程去中心化,納入邊陲與在地知識 ②教學重對話與多元詮釋 ③評量多元化,拒絕單一標準 ④重視小敘事(學生生命經驗)。"},
{s:"教",y:111,q:"【非選】功能論 vs 衝突論:學校教育是「錦上添花」還是「雪中送炭」?各兩觀點。",a:"功能論:①學校執行社會化與選擇功能,依才能分配位置(促流動)②教育擴張提供向上機會→雪中送炭可能。衝突論:①學校再製階級(文化資本、符碼差異)②文憑主義服務優勢群體→實為錦上添花。結論:引柯爾曼報告與積極差別待遇論述折衷。"},
{s:"國",y:115,q:"【寫作】被擁抱的那一刻(幼猴 Panchi 與猴群接納的故事引導)",a:"取材方向:自身「從邊緣到被接納」的經驗(轉學、社團、特教現場的孩子)。結構:場景破題(那一刻的畫面)→受挫與孤獨的鋪陳(玩偶=安全物的隱喻)→轉折:誰向你伸出手→體悟:接納的力量與自己成為伸手的人(教育者視角收束)。"},
{s:"國",y:114,q:"【寫作】群體與個人(李安獲終身成就獎致詞引導)",a:"論述軸:個人不必在順從與出走間二選一——「加入並改變」是第三條路。舉例:李安入工會促成改變;自身在學校/團隊中以參與改變體制的經驗。收束:內心與外在世界的互動性,個人成全群體、群體成就個人。"},
{s:"國",y:113,q:"【寫作】虛構與真實(〈隧道〉一文延伸:作文為得獎而虛構)",a:"思辨軸:虛構的兩面——공式化造假失去溝通初衷 vs 想像作為自我探索與療癒。立場:書寫應忠於真實情意,虛構可以是通往真實的路徑而非逃避。以陶淵明「少無適俗韻」收束:面對真實自我的勇氣。"},
{s:"國",y:112,q:"【寫作】如何扮演稱職的扶羊人(紐西蘭扶羊人傳說引導)",a:"隱喻拆解:雨=看不見的重壓;倒地的羊=受困者;扶羊人=不需完全理解仍願陪伴的人。稱職要件:看見(敏察)、靠近(不評價的陪伴)、擠乾羊毛(實質協助)、扶起後放手(維護尊嚴與自主)。以教育現場或自身陪伴經驗作例。"},
{s:"國",y:111,q:"【寫作】如果我是偏鄉教師(《山村猶有讀書聲》引導)",a:"想像框架:混齡教學的一天→困境(資源、家庭功能、離別)→我的作為(把限制變特色:小校深耕、社區即教材)→教育信念收束(每個孩子都值得一位不離開的老師)。"}
];

const SUBNAME={'課':'課程教學與評量','學':'學習者發展與適性輔導','教':'教育理念與實務','國':'國語文'};
let mode='mcq', subj='all', yearSel='all';
let pool=[], idx=0, ok=0, bad=0, wrongs=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function srcArr(){return mode=='mcq'?MCQ:(mode=='card'?CARDS:ESSAY);}
function buildChips(){
  const ys=['all',115,114,113,112,111];
  document.getElementById('fYear').innerHTML=ys.map(y=>
    `<div class="chip ${y==yearSel?'on':''}" onclick="setYear('${y}')">${y=='all'?'全部年度':y+' 年'}</div>`).join('');
  const subs=[...new Set(srcArr().map(q=>q.s))];
  let html=`<div class="chip ${subj=='all'?'on':''}" onclick="setSubj('all')">全部科目</div>`;
  ['課','學','教','國'].forEach(s=>{if(subs.includes(s))html+=`<div class="chip ${subj==s?'on':''}" onclick="setSubj('${s}')">${SUBNAME[s]}</div>`;});
  document.getElementById('fSubj').innerHTML=html;
}
function setMode(m){mode=m;subj='all';
  document.getElementById('tabMcq').classList.toggle('on',m=='mcq');
  document.getElementById('tabCard').classList.toggle('on',m=='card');
  document.getElementById('tabEssay').classList.toggle('on',m=='essay');
  restart();}
function setYear(y){yearSel=y;restart();}
function setSubj(s){subj=s;restart();}
function restart(){
  pool=srcArr().filter(q=>(yearSel=='all'||q.y==yearSel)&&(subj=='all'||q.s==subj));
  pool=shuffle(pool.slice());
  idx=0;ok=0;bad=0;wrongs=[];
  document.getElementById('revBox').classList.remove('show');
  buildChips();render();}
function upd(){
  document.getElementById('prog').textContent=Math.min(idx+1,pool.length)+'/'+pool.length;
  document.getElementById('nOk').textContent=ok;
  document.getElementById('nBad').textContent=bad;}
function render(){
  const st=document.getElementById('stage');
  if(!pool.length){st.innerHTML='<div class="card done"><p>此篩選條件沒有題目,換個年度或科目試試。</p></div>';upd();return;}
  if(idx>=pool.length){
    const pct=pool.length?Math.round(ok/pool.length*100):0;
    st.innerHTML=`<div class="card done"><h2>${pct>=80?'🎉':pct>=60?'💪':'📚'} 完成!正確率 ${pct}%</h2>
    <p style="color:var(--sub);margin-bottom:16px">答對 ${ok}.答錯 ${bad}${bad?'.點「錯題本」複習':''}</p>
    <button class="act" onclick="restart()">再刷一輪</button></div>`;
    upd();return;}
  const q=pool[idx];
  const meta=`<span class="pill">${q.y} 年</span>${SUBNAME[q.s]||''}.第 ${idx+1} 題`;
  if(mode=='mcq'){
    st.innerHTML=`<div class="card">
      <div class="qmeta">${meta}</div>
      <div class="qtext">${q.q}</div>
      <div class="opts">${['A','B','C','D'].map(o=>`<button class="opt" id="op${o}" onclick="pick('${o}')">${o}</button>`).join('')}</div>
      <div class="ansbox" id="ab"></div>
      <div class="row" style="margin-top:12px"><button class="act hide" id="nx" onclick="next()">下一題 →</button></div>
    </div>`;
  }else{
    const lbl=mode=='essay'?'看答題要點':'看答案';
    st.innerHTML=`<div class="card">
      <div class="qmeta">${meta}</div>
      <div class="cardq">${q.q}</div>
      <div class="carda" id="ca">💡 ${q.a}</div>
      <div class="row">
        <button class="act ghost" id="flip" onclick="flip()">${lbl}</button>
        <span id="judge" class="hide">
          <button class="act" style="background:var(--ok)" onclick="mark(true)">${mode=='essay'?'有掌握 ✓':'答對 ✓'}</button>
          <button class="act" style="background:var(--bad)" onclick="mark(false)">${mode=='essay'?'要再讀 ✗':'答錯 ✗'}</button>
        </span>
      </div>
    </div>`;}
  upd();}
function pick(o){
  const q=pool[idx];
  ['A','B','C','D'].forEach(x=>document.getElementById('op'+x).disabled=true);
  const ab=document.getElementById('ab');
  const ex=q.e?'\n💡 '+q.e:'';
  if(o==q.a){ok++;document.getElementById('op'+o).classList.add('right');
    ab.className='ansbox show ok';ab.textContent='✅ 答對!官方答案 '+q.a+ex;}
  else{bad++;wrongs.push(q);
    document.getElementById('op'+o).classList.add('wrong');
    document.getElementById('op'+q.a).classList.add('right');
    ab.className='ansbox show bad';ab.textContent='❌ 官方答案是 '+q.a+ex;}
  document.getElementById('nx').classList.remove('hide');upd();}
function flip(){document.getElementById('ca').classList.add('show');
  document.getElementById('flip').classList.add('hide');
  document.getElementById('judge').classList.remove('hide');}
function mark(good){const q=pool[idx];
  if(good)ok++;else{bad++;wrongs.push(q);}
  idx++;render();}
function next(){idx++;render();}
function toggleRev(){
  const rb=document.getElementById('revBox');
  if(rb.classList.contains('show')){rb.classList.remove('show');return;}
  rb.innerHTML=wrongs.length?'<b>❌ 本輪錯題('+wrongs.length+')</b><br>'+
    wrongs.map(w=>'<div style="margin-top:8px">['+w.y+' '+(SUBNAME[w.s]||'')+'] '+w.q.slice(0,80)+'…<br><b>→ '+(w.a.length>1?w.a.slice(0,120):'答案 '+w.a)+'</b></div>').join('')
    :'目前沒有錯題 🎉';
  rb.classList.add('show');}
restart();
</script>
</body>
</html>
