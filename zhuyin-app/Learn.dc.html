<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>符號學習</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;color:#2B2A4C}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#FFF6E5;padding:28px 48px 32px;display:flex;flex-direction:column;gap:20px;position:relative;overflow:hidden;font-family:'Noto Sans TC',system-ui,sans-serif;color:#2B2A4C">

<div style="display:flex;align-items:center;gap:20px">
<a href="Main.dc.html" aria-label="回學習地圖" style="width:56px;height:56px;border-radius:28px;background:#fff;border:3px solid #2B2A4C;display:flex;align-items:center;justify-content:center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div style="font-size:32px;font-weight:900">第 {{lvl}} 關 · {{lvlSyms}}</div>
<div style="flex:1;height:20px;border-radius:10px;background:#fff;border:3px solid #2B2A4C;overflow:hidden;box-sizing:border-box">
<div style="width:{{prog}}%;height:100%;background:#7FE0C3"></div>
</div>
<div style="font-size:20px;font-weight:700">{{idx}} / {{lvlCount}}</div>
</div>

<div style="display:flex;gap:28px;flex:1;min-height:0">

<div style="width:212px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start;overflow-y:auto;padding:2px 6px 10px 2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="37">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" aria-label="{{t.sym}}" style="{{t.style}}">
<span style="font-size:44px;font-weight:900;line-height:1">{{t.label}}</span>
</button>
</sc-for>
</div>

<div style="flex:1;background:#fff;border:4px solid #2B2A4C;border-radius:32px;padding:24px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 8px 0 #2B2A4C">
<div style="font-size:22px;font-weight:700;color:#5A5770">看筆順:第 {{step}} 畫 / 共 {{total}} 畫</div>
<div style="width:380px;height:380px;position:relative;border:3px dashed #B9B2A0;border-radius:20px;box-sizing:border-box;background:#FFFBF2;display:flex;align-items:center;justify-content:center">
<div style="position:absolute;left:50%;top:10px;bottom:10px;border-left:2px dashed #E3DCCB"></div>
<div style="position:absolute;top:50%;left:10px;right:10px;border-top:2px dashed #E3DCCB"></div>
<svg viewBox="-5 -5 110 110" width="340" height="340" style="position:relative" role="img" aria-label="{{sym}}的筆順動畫"><sc-for list="{{strokes}}" as="p" hint-placeholder-count="2"><path d="{{p.d}}" fill="none" stroke="#E3DCCB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></sc-for><sc-for list="{{strokes}}" as="p" hint-placeholder-count="2"><path d="{{p.d}}" pathLength="1" fill="none" stroke="#FF6B5B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1" stroke-dashoffset="{{p.off}}"/></sc-for><sc-for list="{{strokes}}" as="p" hint-placeholder-count="2"><g opacity="{{p.badge}}"><circle cx="{{p.x}}" cy="{{p.y}}" r="5.5" fill="#2B2A4C"/><text x="{{p.x}}" y="{{p.ty}}" text-anchor="middle" font-size="7.5" font-weight="900" fill="#FFF6E5" font-family="Noto Sans TC, sans-serif">{{p.n}}</text></g></sc-for></svg>
</div>
<div style="display:flex;gap:16px">
<button onClick="{{replay}}" style="min-height:52px;padding:0 28px;border-radius:26px;background:#fff;border:3px solid #2B2A4C;font-size:22px;font-weight:700">再看一次</button>
<button style="min-height:52px;padding:0 28px;border-radius:26px;background:#7FE0C3;border:3px solid #2B2A4C;font-size:22px;font-weight:700;box-shadow:0 4px 0 #2B2A4C">我來描</button>
</div>
</div>

<div style="width:380px;display:flex;flex-direction:column;gap:10px">
<button onClick="{{play}}" style="display:flex;align-items:center;gap:16px;min-height:88px;padding:0 24px;border-radius:44px;background:#FFC93C;border:4px solid #2B2A4C;box-shadow:0 6px 0 #2B2A4C;text-align:left">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#2B2A4C"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
<span style="font-size:28px;font-weight:900">聽聽「{{sym}}」的聲音</span>
</button>
<sc-if value="{{hasInfo}}" hint-placeholder-val="{{true}}">
<div style="background:#E4F6FF;border:3px solid #2B2A4C;border-radius:24px;padding:16px 20px">
<div style="font-size:18px;font-weight:700;color:#3B5C78;margin-bottom:4px">嘴巴怎麼做?</div>
<div style="font-size:22px;font-weight:500;line-height:1.5">{{hint}}</div>
</div>
<div style="font-size:20px;font-weight:700;margin-top:4px">哪些字有「{{sym}}」?</div>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{words}}" as="w" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:16px;background:#fff;border:3px solid #2B2A4C;border-radius:20px;padding:8px 16px 8px 8px">
<div style="width:64px;height:64px;border-radius:16px;background:{{w.bg}};border:3px solid #2B2A4C;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900">{{w.han}}</div>
<div style="font-size:30px;font-weight:700;letter-spacing:2px">{{w.zy}}</div>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noInfo}}" hint-placeholder-val="{{false}}">
<div style="background:#fff;border:3px dashed #B9B2A0;border-radius:24px;padding:24px 20px;font-size:22px;font-weight:500;line-height:1.5;color:#5A5770">「{{sym}}」的例字和嘴型提示製作中</div>
</sc-if>
</div>
</div>

<div style="display:flex;justify-content:flex-end">
<a href="Game.dc.html" style="display:flex;align-items:center;gap:12px;min-height:64px;padding:0 36px;border-radius:32px;background:#FF9C8F;border:4px solid #2B2A4C;box-shadow:0 6px 0 #2B2A4C;font-size:28px;font-weight:900">
去玩遊戲
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const lv = this.readLevel();
    this.state = { level: lv, picked: this.levels()[lv - 1].charAt(0), t: 0 };
  }
  levels() {
    return ['ㄅㄆㄇㄈ', 'ㄉㄊㄋㄌ', 'ㄍㄎㄏ', 'ㄐㄑㄒ', 'ㄓㄔㄕㄖ', 'ㄗㄘㄙ', 'ㄧㄨㄩ', 'ㄚㄛㄜㄝ', 'ㄞㄟㄠㄡ', 'ㄢㄣㄤㄥㄦ', 'ˊˇˋ˙'];
  }
  readLevel() {
    try {
      const n = parseInt(localStorage.getItem('zhuyin_level') || '3', 10);
      return n >= 1 && n <= 11 ? n : 3;
    } catch (e) {
      return 3;
    }
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const n = this.state.t + 1;
      const patch = { t: n };
      if (n % 25 === 0) {
        this.logTime();
        const l = this.readLevel();
        if (l !== this.state.level) {
          patch.level = l;
          patch.picked = this.levels()[l - 1].charAt(0);
          patch.t = 0;
        }
      }
      this.setState(patch);
    }, 40);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  logTime() {
    if (!this.act || Date.now() - this.act > 30000) { return; }
    try {
      const d = new Date();
      const k = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      const o = JSON.parse(localStorage.getItem('zhuyin_log') || '{}') || {};
      o[k] = (o[k] || 0) + 1;
      localStorage.setItem('zhuyin_log', JSON.stringify(o));
    } catch (e) {}
  }
  disp(s) {
    return s.charCodeAt(0) < 0x3100 ? (s === '˙' ? '˙ㄚ' : 'ㄚ' + s) : s;
  }
  say(s) {
    this.act = Date.now();
    const tone = { 'ˊ': '麻', 'ˇ': '馬', 'ˋ': '罵', '˙': '嗎' }[s];
    if (tone) {
      try {
        const u = new SpeechSynthesisUtterance(tone);
        u.lang = 'zh-TW';
        u.rate = 0.8;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      } catch (e) {}
      return;
    }
    try {
      if (this.audio) { this.audio.pause(); }
      this.audio = new Audio('audio/z' + s.codePointAt(0).toString(16) + '.mp3');
      const p = this.audio.play();
      if (p && p.catch) { p.catch(() => {}); }
    } catch (e) {}
  }
  renderVals() {
    const data = {
      'ㄍ': { hint: '舌頭後面碰到上顎,再放開,不要吹氣。', words: [['狗', 'ㄍㄡˇ', '#FFD35A'], ['鍋', 'ㄍㄨㄛ', '#8CCBFF'], ['哥', 'ㄍㄜ', '#7FE0C3']] },
      'ㄎ': { hint: '位置和ㄍ一樣,放開的時候吹一口氣。', words: [['開', 'ㄎㄞ', '#FFD35A'], ['苦', 'ㄎㄨˇ', '#8CCBFF'], ['看', 'ㄎㄢˋ', '#7FE0C3']] },
      'ㄏ': { hint: '嘴巴張開,像哈氣一樣輕輕吹出來。', words: [['花', 'ㄏㄨㄚ', '#FFD35A'], ['河', 'ㄏㄜˊ', '#8CCBFF'], ['好', 'ㄏㄠˇ', '#7FE0C3']] },
    };
    const cur = this.state.picked;
    const more = {
      'ㄅ': ['雙唇閉起來,再放開,不要吹氣。', '爸|ㄅㄚˋ', '包|ㄅㄠ', '杯|ㄅㄟ'],
      'ㄆ': ['和ㄅ一樣,放開時吹一口氣。', '皮|ㄆㄧˊ', '跑|ㄆㄠˇ', '盤|ㄆㄢˊ'],
      'ㄇ': ['雙唇閉起來,聲音從鼻子出來。', '媳|ㄇㄚ', '貓|ㄇㄠ', '米|ㄇㄧˇ'],
      'ㄈ': ['上排牙齒輕碰下嘴唇,再吹氣。', '飛|ㄈㄟ', '飯|ㄈㄢˋ', '風|ㄈㄥ'],
      'ㄉ': ['舌尖頂住上排牙齒後面,再放開,不吹氣。', '刀|ㄉㄠ', '大|ㄉㄚˋ', '豆|ㄉㄡˋ'],
      'ㄊ': ['位置和ㄉ一樣,放開時吹一口氣。', '太|ㄊㄞˋ', '兔|ㄊㄨˋ', '桃|ㄊㄠˊ'],
      'ㄋ': ['舌尖頂住上排牙齒後面,聲音從鼻子出來。', '牛|ㄋㄧㄡˊ', '奶|ㄋㄞˇ', '鳥|ㄋㄧㄠˇ'],
      'ㄌ': ['舌尖輕碰上排牙齒後面,聲音從舌頭兩邊出來。', '辣|ㄌㄚˋ', '梨|ㄌㄧˊ', '路|ㄌㄨˋ'],

      'ㄑ': ['和ㄐ一樣,放開時吹一口氣。', '七|ㄑㄧ', '球|ㄑㄧㄡˊ', '氣|ㄑㄧˋ'],
      'ㄒ': ['嘴角微笑,舌面靠近上黠,讓氣輕輕擠出來。', '西|ㄒㄧ', '蝦|ㄒㄧㄚ', '小|ㄒㄧㄠˇ'],
      'ㄓ': ['舌尖往上捲,輕碰上黠,不吹氣。', '豬|ㄓㄨ', '紙|ㄓˇ', '枝|ㄓ'],
      'ㄔ': ['和ㄓ一樣,放開時吹一口氣。', '吃|ㄔ', '車|ㄔㄜ', '蟲|ㄔㄨㄥˊ'],

      'ㄖ': ['發音位置和ㄕ一樣,聲帶有震動。', '日|ㄖˋ', '肉|ㄖㄡˋ', '熱|ㄖㄜˋ'],
      'ㄗ': ['舌尖頂住上下牙齒中間,不吹氣。', '字|ㄗˋ', '左|ㄗㄨㄛˇ', '早|ㄗㄠˇ'],

      'ㄧ': ['嘴角往兩邊拉,像笑一樣。', '衣|ㄧ', '椅|ㄧˇ', '鴨|ㄧㄚ'],
      'ㄨ': ['嘴唇圆圆噘起來。', '屋|ㄨ', '五|ㄨˇ', '蛙|ㄨㄚ'],
      'ㄩ': ['嘴唇噘成小圓,發「ㄧ」的音。', '魚|ㄩˊ', '雨|ㄩˇ', '月|ㄩㄝˋ'],
      'ㄚ': ['嘴巴張大,舌頭放平。', '阿|ㄚ', '八|ㄅㄚ', '拉|ㄌㄚ'],
      'ㄛ': ['嘴巴半開,嘴唇微圓。', '波|ㄅㄛ', '破|ㄆㄛˋ', '摸|ㄇㄛ'],
      'ㄜ': ['嘴巴半開,嘴角自然放鬆。', '鵝|ㄜˊ', '哥|ㄍㄜ', '河|ㄏㄜˊ'],
      'ㄝ': ['嘴角微微往兩邊拉,嘴巴半開。', '爹|ㄉㄧㄝ', '姐|ㄐㄧㄝˇ', '葉|ㄧㄝˋ'],
      'ㄞ': ['先張大嘴,再往「ㄧ」滑過去。', '愛|ㄞˋ', '菜|ㄘㄞˋ', '白|ㄅㄞˊ'],
      'ㄟ': ['嘴巴半開,再往「ㄧ」滑過去。', '杯|ㄅㄟ', '飛|ㄈㄟ', '美|ㄇㄟˇ'],
      'ㄠ': ['先張大嘴,再慢慢變圓。', '包|ㄅㄠ', '貓|ㄇㄠ', '桃|ㄊㄠˊ'],
      'ㄡ': ['嘴巴半開,再慢慢變圓。', '豆|ㄉㄡˋ', '頭|ㄊㄡˊ', '手|ㄕㄡˇ'],
      'ㄢ': ['嘴巴張開,舌尖往上頂。', '山|ㄕㄢ', '飯|ㄈㄢˋ', '看|ㄎㄢˋ'],
      'ㄣ': ['嘴巴半開,舌尖往上頂。', '門|ㄇㄣˊ', '人|ㄖㄣˊ', '本|ㄅㄣˇ'],
      'ㄤ': ['嘴巴張大,舌根往後頂,聲音從鼻子出來。', '羊|ㄧㄤˊ', '床|ㄔㄨㄤˊ', '湯|ㄊㄤ'],
      'ㄥ': ['嘴巴半開,舌根往後頂,聲音從鼻子出來。', '燈|ㄉㄥ', '風|ㄈㄥ', '冷|ㄌㄥˇ'],
      'ㄦ': ['舌頭往上捲,發出捲舌的聲音。', '兒|ㄦˊ', '耳|ㄦˇ', '二|ㄦˋ'],
      'ˊ': ['二聲:聲音從中間往上揚,像在問「嗯?」。', '麻|ㄇㄚˊ', '牛|ㄋㄧㄡˊ', '紅|ㄏㄨㄥˊ'],
      'ˇ': ['三聲:聲音先往下降,再往上升。', '馬|ㄇㄚˇ', '手|ㄕㄡˇ', '狗|ㄍㄡˇ'],
      'ˋ': ['四聲:聲音從高處快速往下掉。', '罵|ㄇㄚˋ', '大|ㄉㄚˋ', '菜|ㄘㄞˋ'],
      '˙': ['輕聲:又輕又短,寫在注音的前面。', '子|˙ㄗ', '的|˙ㄉㄜ', '嗎|˙ㄇㄚ'],
    };
    let d = data[cur] || null;
    if (!d && more[cur]) {
      const bgs = ['#FFD35A', '#8CCBFF', '#7FE0C3'];
      d = { hint: more[cur][0], words: more[cur].slice(1).map((x, i) => { const p = x.split('|'); return [p[0], p[1], bgs[i]]; }) };
    }
    const all = this.levels()[this.state.level - 1].split('');
    const tabs = all.map((s) => {
      const on = s === cur;
      return {
        sym: s,
        label: this.disp(s),
        on: on,
        pick: () => { this.setState({ picked: s, t: 0 }); this.say(s); },
        style: 'height:76px;border-radius:20px;border:3px solid #2B2A4C;display:flex;align-items:center;justify-content:center;font-family:inherit;background:' + (on ? '#FFC93C' : '#fff') + ';' + (on ? 'box-shadow:0 6px 0 #2B2A4C;' : ''),
      };
    });
