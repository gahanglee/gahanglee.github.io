<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>拼音練習</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;color:#2B2A4C}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F3ECFF;padding:28px 48px 32px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden;font-family:'Noto Sans TC',system-ui,sans-serif;color:#2B2A4C">

<div style="position:absolute;left:-100px;bottom:-130px;width:340px;height:340px;border-radius:170px;background:#FFE7A3"></div>

<div style="display:flex;align-items:center;gap:20px;position:relative">
<a href="Main.dc.html" aria-label="離開拼音練習回學習地圖" style="width:56px;height:56px;border-radius:28px;background:#fff;border:3px solid #2B2A4C;display:flex;align-items:center;justify-content:center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
<div style="font-size:28px;font-weight:900;white-space:nowrap">拼音練習 · {{stepName}}</div>
<div style="flex:1;height:24px;border-radius:12px;background:#fff;border:3px solid #2B2A4C;overflow:hidden;box-sizing:border-box">
<div style="width:{{progress}}%;height:100%;background:#BBA6FF"></div>
</div>
<div style="font-size:22px;font-weight:700;white-space:nowrap">第 {{num}} 題 / {{total}}</div>
</div>

<sc-if value="{{isBuild}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;align-items:center;gap:16px;position:relative">
<div style="display:flex;align-items:center;gap:20px">
<div style="width:96px;height:96px;border-radius:24px;background:#FFD35A;border:4px solid #2B2A4C;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900">{{han}}</div>
<div style="font-size:34px;font-weight:900">把符號和聲調拼起來,拼出「{{han}}」</div>
</div>
<div style="display:flex;align-items:center;gap:14px">
<div style="{{slot1Style}}">{{slot1}}</div>
<div style="font-size:44px;font-weight:900">+</div>
<div style="{{slot2Style}}">{{slot2}}</div>
<div style="font-size:44px;font-weight:900">+</div>
<div style="{{slot3Style}}">{{slot3}}</div>
<div style="font-size:44px;font-weight:900">=</div>
<div style="{{resStyle}}">{{resText}}</div>
</div>
<div style="display:flex;gap:36px;align-items:flex-start">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<div style="font-size:20px;font-weight:700;color:#5A5770">① 前面的符號</div>
<div style="display:flex;gap:12px">
<sc-for list="{{iniTiles}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" aria-label="聲符 {{t.s}}" style="{{t.style}}">{{t.s}}</button>
</sc-for>
</div>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<div style="font-size:20px;font-weight:700;color:#5A5770">② 後面的符號</div>
<div style="display:flex;gap:12px">
<sc-for list="{{finTiles}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" aria-label="韻符 {{t.s}}" style="{{t.style}}">{{t.s}}</button>
</sc-for>
</div>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<div style="font-size:20px;font-weight:700;color:#5A5770">③ 聲調</div>
<div style="display:flex;gap:12px">
<sc-for list="{{toneTiles}}" as="t" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" aria-label="{{t.name}}" style="{{t.style}}">{{t.s}}</button>
<div style="font-size:16px;font-weight:700;color:#5A5770">{{t.name}}</div>
</div>
</sc-for>
</div>
</div>
</div>
<div style="display:flex;align-items:center;justify-content:center;gap:20px;min-height:68px">
<sc-if value="{{isBad}}" hint-placeholder-val="{{false}}">
<div style="background:#fff;border:3px solid #2B2A4C;border-radius:24px;padding:12px 28px;font-size:26px;font-weight:700">差一點點,換一個試試看!</div>
</sc-if>
<sc-if value="{{isOk}}" hint-placeholder-val="{{false}}">
<div style="background:#CFEFE6;border:3px solid #2B2A4C;border-radius:24px;padding:12px 28px;font-size:26px;font-weight:900">拼對了!{{syl}} 念「{{han}}」</div>
<button onClick="{{hear}}" style="min-height:56px;padding:0 24px;border-radius:28px;background:#fff;border:4px solid #2B2A4C;font-size:22px;font-weight:700">再聽一次</button>
<button onClick="{{toListen}}" style="min-height:60px;padding:0 32px;border-radius:30px;background:#FF9C8F;border:4px solid #2B2A4C;box-shadow:0 6px 0 #2B2A4C;font-size:24px;font-weight:900">聽音選拼音</button>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{isListen}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;align-items:center;gap:14px;position:relative">
<div style="font-size:36px;font-weight:900">聽聽看,是哪一個拼音?</div>
<button onClick="{{hear}}" style="display:flex;align-items:center;gap:14px;min-height:88px;padding:0 40px;border-radius:44px;background:#FFC93C;border:4px solid #2B2A4C;box-shadow:0 6px 0 #2B2A4C">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#2B2A4C"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
<span style="font-size:30px;font-weight:900">再聽一次</span>
</button>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;width:100%;margin-top:8px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button onClick="{{o.pick}}" style="{{o.style}}">
<span style="font-size:68px;font-weight:900;line-height:1;letter-spacing:2px">{{o.label}}</span>
</button>
</sc-for>
</div>
<div style="display:flex;align-items:center;justify-content:center;gap:20px;min-height:68px">
<sc-if value="{{lWrong}}" hint-placeholder-val="{{false}}">
<div style="background:#fff;border:3px solid #2B2A4C;border-radius:24px;padding:12px 28px;font-size:26px;font-weight:700">差一點點,再聽一次試試看!</div>
</sc-if>
<sc-if value="{{lRight}}" hint-placeholder-val="{{false}}">
<div style="background:#CFEFE6;border:3px solid #2B2A4C;border-radius:24px;padding:12px 28px;font-size:26px;font-weight:900">答對了!{{han}}({{syl}})</div>
<button onClick="{{nextQ}}" style="min-height:60px;padding:0 32px;border-radius:30px;background:#FF9C8F;border:4px solid #2B2A4C;box-shadow:0 6px 0 #2B2A4C;font-size:24px;font-weight:900">{{nextLabel}}</button>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{isFinish}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;margin-top:60px">
<div style="font-size:56px;font-weight:900">拼音練習全部完成!</div>
<div style="font-size:26px;font-weight:500;color:#5A5770">你已經拼出 {{doneCount}} 個拼音了,太棒了!</div>
<div style="display:flex;gap:16px;margin-top:12px">
<button onClick="{{restart}}" style="min-height:60px;padding:0 32px;border-radius:30px;background:#fff;border:4px solid #2B2A4C;font-size:24px;font-weight:700">再玩一次</button>
<a href="Main.dc.html" style="display:flex;align-items:center;min-height:60px;box-sizing:border-box;padding:0 32px;border-radius:30px;background:#7FE0C3;border:4px solid #2B2A4C;box-shadow:0 6px 0 #2B2A4C;font-size:24px;font-weight:900">回地圖</a>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, phase: 'build', pi: null, pf: null, pt: null, lp: null, done: this.readDone() };
  }
  combos() {
    // [聲符, 韻符, 例字, 聲調, 另一個真實聲調, [另兩個真實聲符(同聲調)]]
    return [
      ['ㄅ', 'ㄚ', '爸', 'ˋ', 'ˇ', ['ㄆ', 'ㄉ']],
      ['ㄇ', 'ㄚ', '媽', '', 'ˇ', ['ㄆ', 'ㄊ']],
      ['ㄉ', 'ㄚ', '大', 'ˋ', 'ˊ', ['ㄅ', 'ㄊ']],
      ['ㄍ', 'ㄜ', '哥', '', 'ˊ', ['ㄎ', 'ㄏ']],
      ['ㄏ', 'ㄜ', '河', 'ˊ', 'ˋ', ['ㄍ', 'ㄎ']],
      ['ㄅ', 'ㄠ', '包', '', 'ˇ', ['ㄆ', 'ㄉ']],
      ['ㄇ', 'ㄠ', '貓', '', 'ˊ', ['ㄊ', 'ㄉ']],
      ['ㄉ', 'ㄡ', '豆', 'ˋ', '', ['ㄊ', 'ㄌ']],
      ['ㄍ', 'ㄡ', '狗', 'ˇ', 'ˋ', ['ㄎ', 'ㄏ']],
      ['ㄅ', 'ㄟ', '杯', '', 'ˇ', ['ㄆ', 'ㄈ']],
      ['ㄇ', 'ㄣ', '門', 'ˊ', 'ˋ', ['ㄈ', 'ㄖ']],
      ['ㄖ', 'ㄣ', '人', 'ˊ', 'ˋ', ['ㄇ', 'ㄈ']],
    ];
  }
  readDone() {
    try {
      const v = JSON.parse(localStorage.getItem('zhuyin_pinyin') || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) {
      return [];
    }
  }
  componentDidMount() {
    this.timer = setInterval(() => this.logTime(), 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  logTime() {
    if (!this.act || Date.now() - this.act > 30000) { return; }
    try {
      const d = new Date();
      const k = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      const o = JSON.parse(localStorage.getItem('zhuyin_log') || '{}') || {};
      o[k] = (o[k] || 0) + 1;
      localStorage.setItem('zhuyin_log', JSON.stringify(o));
    } catch (e) {}
  }
  say(han) {
    this.act = Date.now();
    try {
      if (this.au) { this.au.pause(); }
      this.au = new Audio('audio/w' + han.codePointAt(0).toString(16) + '.mp3');
      const p = this.au.play();
      if (p && p.catch) { p.catch(() => {}); }
    } catch (e) {}
  }
  toneName(t) {
    return { '': '一聲', 'ˊ': '二聲', 'ˇ': '三聲', 'ˋ': '四聲' }[t];
  }
  renderVals() {
    const st = this.state;
    const all = this.combos();
    const c = all[st.i];
    const ini = c[0];
    const fin = c[1];
    const han = c[2];
    const tone = c[3];
    const syl = ini + fin + tone;
    const rot = (arr, n) => arr.map((x, k) => arr[(k + n) % arr.length]);
    const iniArr = rot([ini, c[5][0], c[5][1]], st.i);
    const finOthers = ['ㄚ', 'ㄜ', 'ㄠ', 'ㄡ', 'ㄟ', 'ㄣ'].filter((x) => x !== fin);
    const finArr = rot([fin, finOthers[st.i % finOthers.length], finOthers[(st.i + 2) % finOthers.length]], st.i + 1);
    const toneArr = rot(['', 'ˊ', 'ˇ', 'ˋ'], st.i % 4);
    const tile = (on) => 'width:88px;height:88px;border-radius:22px;border:4px solid #2B2A4C;font-size:48px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;background:' + (on ? '#FFC93C' : '#fff') + ';box-shadow:' + (on ? '0 0 0 4px #FFE7A3' : '0 6px 0 #2B2A4C') + ';';
    const iniTiles = iniArr.map((s) => ({ s, on: st.pi === s, style: tile(st.pi === s), pick: () => this.pick('pi', s) }));
    const finTiles = finArr.map((s) => ({ s, on: st.pf === s, style: tile(st.pf === s), pick: () => this.pick('pf', s) }));
    const toneTiles = toneArr.map((t) => ({ s: fin + t, name: this.toneName(t), on: st.pt === t, style: tile(st.pt === t), pick: () => this.pick('pt', t) }));
    const all3 = st.pi !== null && st.pf !== null && st.pt !== null;
    const ok = all3 && st.pi === ini && st.pf === fin && st.pt === tone;
    const bad = all3 && !ok;
    const slot = (v) => 'width:104px;height:104px;border-radius:26px;border:4px dashed #2B2A4C;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;background:' + (v ? '#fff' : '#FBF8FF') + ';';
    const phaseName = st.phase === 'build' ? '拼一拼' : st.phase === 'listen' ? '聽音選拼音' : '完成';
    const labels = (() => {
      const alt = [ini + fin + c[4], c[5][0] + fin + tone, c[5][1] + fin + tone];
      return rot([syl].concat(alt), st.i % 4);
    })();
    const lRight = st.lp === syl;
    const lWrong = st.lp !== null && !lRight;
    const opts = labels.map((l) => {
      let bg = '#fff';
      if (st.lp === l) { bg = l === syl ? '#7FE0C3' : '#FFB4AA'; }
      return {
        label: l,
        style: 'min-height:190px;border-radius:32px;border:5px solid #2B2A4C;box-shadow:0 8px 0 #2B2A4C;display:flex;align-items:center;justify-content:center;background:' + bg + ';',
        pick: () => this.pickL(l, syl, han),
      };
    });
    const last = st.i === all.length - 1;
    const slot3 = st.pt === null ? '?' : st.pt === '' ? '一聲' : st.pt;
    return {
      stepName: phaseName,
      progress: Math.round(((st.i + (st.phase === 'build' ? 0 : st.phase === 'listen' ? 0.5 : 1)) / all.length) * 100),
      num: st.i + 1,
      total: all.length,
      isBuild: st.phase === 'build',
      isListen: st.phase === 'listen',
      isFinish: st.phase === 'finish',
      han: han,
      syl: syl,
      slot1: st.pi || '?',
      slot2: st.pf || '?',
      slot3: slot3,
      slot1Style: slot(st.pi),
      slot2Style: slot(st.pf),
      slot3Style: slot(st.pt !== null) + (st.pt === '' ? 'font-size:34px;' : ''),
      resText: ok ? syl : '?',
      resStyle: 'min-width:170px;height:104px;padding:0 14px;border-radius:26px;border:4px solid #2B2A4C;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;letter-spacing:2px;background:' + (ok ? '#7FE0C3' : '#fff') + ';',
      iniTiles,
      finTiles,
      toneTiles,
      isOk: ok,
      isBad: bad,
      hear: () => this.say(han),
      toListen: () => { this.setState({ phase: 'listen', lp: null }); this.say(han); },
      opts,
      lRight,
      lWrong,
      nextLabel: last ? '看結果' : '下一題',
      nextQ: () => {
        if (last) { this.setState({ phase: 'finish' }); } else { this.setState({ i: st.i + 1, phase: 'build', pi: null, pf: null, pt: null, lp: null }); }
      },
      doneCount: st.done.filter((x) => '爸媽大哥河包貓豆狗杯門人'.indexOf(x) >= 0).length,
      restart: () => this.setState({ i: 0, phase: 'build', pi: null, pf: null, pt: null, lp: null }),
    };
  }
  pick(key, s) {
    this.act = Date.now();
    const next = {};
    next[key] = s;
    const c = this.combos()[this.state.i];
    const pi = key === 'pi' ? s : this.state.pi;
    const pf = key === 'pf' ? s : this.state.pf;
    const pt = key === 'pt' ? s : this.state.pt;
    this.setState(next);
    if (pi === c[0] && pf === c[1] && pt === c[3]) { this.say(c[2]); }
  }
  pickL(label, answer, han) {
    this.act = Date.now();
    if (this.state.lp === answer) { return; }
    if (label === answer && this.state.done.indexOf(han) < 0) {
      const list = this.state.done.concat([han]);
      try { localStorage.setItem('zhuyin_pinyin', JSON.stringify(list)); } catch (e) {}
      this.setState({ lp: label, done: list });
    } else {
      this.setState({ lp: label });
    }
  }
}
</script>
</body>
</html>
